<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta tags for accessibility and SEO -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Build your custom burger by adding and selecting from a variety of ingredients. Create your perfect burger from scratch and enjoy the fun of customization!">
  <meta name="author" content="Deanna Mandarino">

  <!-- Link to external CSS stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Preconnect to improve font loading performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Link to Google Fonts (Oswald)-->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

  <!-- Favicon for the page -->
  <link rel="icon" href="images/burger-favicon.png" type="image/x-icon">

  <!-- Page title for browser tab -->
  <title>Build a Burger</title>
</head>
<body>
  <main class="burger-builder">
    <!-- Header Section with Title and Description -->
    <header class="burger-builder__header">
      <h1 class="burger-builder__title">Build a Burger</h1>
      <p class="burger-builder__description">Customize your burger by adding ingredients below!</p>
    </header>

    <!-- Section for displaying ingredients list -->
    <section class="burger-builder__ingredients">
      <ul class="burger-builder__ingredients-list">
        <li class="burger-builder__ingredient-item">Loading ingredients...</li>
      </ul>
    </section>
    
    <!-- Section for the form to add new ingredients -->
    <section class="burger-builder__add-ingredient">
      <form class="burger-builder__ingredient-form" action="#" method="post">
        <!-- Hidden label for accessibility (screen readers) -->
        <label for="ingredient-name" class="burger-builder__ingredient-label sr-only">Ingredient Name</label>
        <input type="text" name="ingredient" id="ingredient-name" class="burger-builder__ingredient-input" placeholder="Ingredient Name" aria-label="Enter the name of the ingredient" required>

        <!-- Button to submit the form -->
        <button type="submit" class="burger-builder__add-button">+ Add Ingredient</button>
      </form>
    </section>
  </main>

  <!-- External JavaScript file linked with defer to improve page load -->
  <script src="script.js" defer></script>
</body>
</html>
